---
services:
  weaviate:
    command:
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --scheme
    - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.2
    ports:
    - 8080:8080
    - 50051:50051
    volumes:
    - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/.well-known/ready >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      ENABLE_API_BASED_MODULES: 'true'
      CLUSTER_HOSTNAME: 'node1'

  healthcare-rag:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      weaviate:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: '8080'
      WEAVIATE_GRPC_PORT: '50051'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    init: true
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  weaviate_data:
