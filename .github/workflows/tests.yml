name: Tests

# The offline suite is the regression net for the safety gate, the privacy
# sanitizer and the graph runtime. Nothing else in CI ran it, so drift between a
# changed signature and its tests could reach main unnoticed. This closes that.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up uv
        uses: astral-sh/setup-uv@19b4d1e990bec64818914c40230bde93a0de300b # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra evals --extra dev --extra graph-sqlite
      # No OPENAI_API_KEY / WEAVIATE_URL is provided on purpose: the offline
      # suite must stay runnable without credentials or network. A test that
      # needs either belongs behind a marker, not in this job.
      - name: Run offline tests
        run: uv run pytest -q
