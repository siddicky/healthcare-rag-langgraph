name: Deploy

on:
  push:
    tags: ["v*.*.*"]
  # Rollback. Manual by policy (docs/decisions/release-tags-and-rollback.md):
  # a red smoke leaves the bad version live and a human decides. This only makes
  # that decision one click instead of a laptop flyctl session.
  workflow_dispatch:
    inputs:
      version:
        description: "Released tag to roll back to, e.g. v1.2.2. Its image AND its deploy/fly.prod.toml are deployed."
        required: true
        type: string
      reason:
        description: "Why this rollback is happening — recorded in the job summary."
        required: true
        type: string
      image_digest:
        description: "Break-glass override, sha256:<64 hex>. Only when the release's GHCR tag is gone."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  # Top-level concurrency only scopes workflow runs; the real prod lock is
  # the per-job `concurrency:` on deploy-prod (env-wide, non-cancelling).
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # Tag pushes build; a dispatch is a rollback to an image that already
    # exists, so it must never rebuild. deploy-prod needs this job, so gating
    # here skips the forward path as a whole.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository (tag ref)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag exists on origin and checkout is at tag commit
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          echo "Verifying tag refs/tags/$TAG exists on origin..."
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::tag refs/tags/$TAG not found on origin — push the tag first"
            exit 1
          fi
          # Confirm we are actually at the tag commit (not default branch tip).
          TAG_SHA="$(git rev-list -n 1 "refs/tags/$TAG" 2>/dev/null || git rev-parse "refs/tags/$TAG^{}" 2>/dev/null || true)"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Tag $TAG -> $TAG_SHA"
          echo "HEAD     -> $HEAD_SHA"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::HEAD $HEAD_SHA does not match tag $TAG ($TAG_SHA) — checkout did not land on the tag commit"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_SHA" "origin/main"; then
            echo "::error::tag $TAG points to $TAG_SHA, which is not reachable from origin/main"
            exit 1
          fi
          echo "Tag existence + checkout + main ancestry verification OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          # Provenance attestation disabled per plan (reproducible digest pinning without extra attest layer).
          # The build step sets provenance: false explicitly as well.

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    environment:
      name: production
      # url is set after deploy; Fly app URL is https://hc-rag-server-prod.fly.dev
      url: https://hc-rag-server-prod.fly.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out repository (for deploy config)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Use the same tag ref that was built; keeps deploy/fly.prod.toml pinned to the built commit.
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verify production environment protection (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_PAT: ${{ secrets.ENVIRONMENT_AUDIT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Verifying GitHub Environment 'production' protection..."
          echo "This step asserts: deployment tag policy v*.*.*"
          echo "It fails closed with a clear message if the API is unavailable or the check is inconclusive."
          echo ""
          echo "NOTE: Reading environment protection_rules typically requires a token with"
          echo "Actions: read or classic repo scope. The default GITHUB_TOKEN often lacks sufficient scope"
          echo "to read protection_rules. If so, set a minimally-scoped PAT as ENVIRONMENT_AUDIT_PAT"
          echo "(classic PAT: repo scope, or fine-grained PAT with Actions: read on this repo)."
          echo "The workflow tries ENVIRONMENT_AUDIT_PAT first, then GITHUB_TOKEN."
          echo ""

          # Try PAT first if available, then GITHUB_TOKEN
          SUCCESS=0
          RAW_JSON=""
          TOKEN_USED=""
          if [ -n "${AUDIT_PAT:-}" ]; then
            echo "Trying ENVIRONMENT_AUDIT_PAT..."
            if RAW_JSON="$(GH_TOKEN="$AUDIT_PAT" gh api "repos/${REPO}/environments/production" 2>&1)"; then
              echo "PAT query succeeded."
              SUCCESS=1
              TOKEN_USED="$AUDIT_PAT"
            else
              echo "PAT query failed (first 500 chars):"
              echo "$RAW_JSON" | head -c 500; echo ""
              echo "Falling back to GITHUB_TOKEN..."
              if RAW_JSON="$(GH_TOKEN="$GH_TOKEN" gh api "repos/${REPO}/environments/production" 2>&1)"; then
                echo "GITHUB_TOKEN query succeeded."
                SUCCESS=1
                TOKEN_USED="$GH_TOKEN"
              else
                echo "GITHUB_TOKEN query also failed."
                echo "$RAW_JSON" | head -c 500; echo ""
              fi
            fi
          else
            echo "ENVIRONMENT_AUDIT_PAT not set — trying GITHUB_TOKEN..."
            if RAW_JSON="$(GH_TOKEN="$GH_TOKEN" gh api "repos/${REPO}/environments/production" 2>&1)"; then
              echo "GITHUB_TOKEN query succeeded."
              SUCCESS=1
              TOKEN_USED="$GH_TOKEN"
            else
              echo "GITHUB_TOKEN query failed (first 500 chars):"
              echo "$RAW_JSON" | head -c 500; echo ""
            fi
          fi

          if [ "$SUCCESS" -ne 1 ]; then
            echo ""
            echo "::error::Environment protection verification FAILED (inconclusive API response)."
            echo "::error::The production environment 'production' could not be read via the GitHub API."
            echo "::error::If GITHUB_TOKEN lacks scope to read environment protection_rules, set a"
            echo "::error::minimally-scoped PAT as ENVIRONMENT_AUDIT_PAT (Actions: read) in the"
            echo "::error::'production' environment secrets. See decisions.md for scope details."
            echo "::error::Failing closed — refusing to deploy."
            exit 1
          fi

          POLICY_JSON='{"total_count":0,"branch_policies":[]}'
          CUSTOM_POLICIES="$(ENVIRONMENT_JSON="$RAW_JSON" python3 -c "import json, os; data=json.loads(os.environ['ENVIRONMENT_JSON']); print(str(bool((data.get('deployment_branch_policy') or {}).get('custom_branch_policies'))).lower())")"
          if [ "$CUSTOM_POLICIES" = "true" ]; then
            echo "Reading custom deployment branch/tag policies..."
            if POLICY_RESPONSE="$(GH_TOKEN="$TOKEN_USED" gh api "repos/${REPO}/environments/production/deployment-branch-policies?per_page=100" 2>&1)"; then
              POLICY_JSON="$POLICY_RESPONSE"
            else
              echo "$POLICY_RESPONSE" | head -c 500; echo ""
              echo "::error::Deployment policy verification FAILED (policy list unavailable)."
              echo "::error::Failing closed — refusing to deploy."
              exit 1
            fi
          fi
          RAW_JSON="$(ENVIRONMENT_JSON="$RAW_JSON" POLICY_JSON="$POLICY_JSON" python3 -c "import json, os; data=json.loads(os.environ['ENVIRONMENT_JSON']); policies=json.loads(os.environ['POLICY_JSON']); data['deployment_branch_policies']=policies.get('branch_policies', []); print(json.dumps(data))")"

          echo ""
          echo "Raw environment JSON (truncated):"
          echo "$RAW_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d, indent=2)[:4000])"

          # Use python to assert required reviewers + tag policy
          echo "$RAW_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          errors = []

          # Deployment branch/tag policy: expect exact tag pattern v*.*.*
          tag_policy_ok = False
          tag_pattern_found = None
          dbp = data.get('deployment_branch_policy') or {}
          if not dbp.get('custom_branch_policies'):
              errors.append('production environment custom deployment policies are disabled')
          for policy in data.get('deployment_branch_policies') or []:
              if policy.get('name') == 'v*.*.*' and policy.get('type') in (None, 'tag'):
                  tag_policy_ok = True
                  tag_pattern_found = 'v*.*.*'
                  break
          if not tag_policy_ok:
              errors.append(\"deployment tag policy 'v*.*.*' is missing\")

          if errors:
              for e in errors:
                  print(f\"::error::{e}\")
                  sys.stderr.write(f\"ERROR: {e}\\n\")
              sys.exit(1)

          print('Environment protection verification PASSED')
          print(f\"  tag_policy: {tag_pattern_found or 'conditional — not discoverable via this endpoint, see warning above'}\")
          "

          echo ""
          echo "Protection verification complete — proceeding to deploy."

      - name: Set up Docker Buildx (for registry mirror)
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR (for registry mirror)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4
        # This action installs flyctl at a pinned version; token is not needed for install.

      - name: Sync runtime secrets (GitHub Environment → Fly, NAME-only verification)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          COACH_INTERNAL_TOKEN: ${{ secrets.COACH_INTERNAL_TOKEN }}
          COACH_ALLOWED_ORIGINS: ${{ secrets.COACH_ALLOWED_ORIGINS }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          LANGSMITH_FEEDBACK_PROJECT_ID: ${{ secrets.LANGSMITH_FEEDBACK_PROJECT_ID }}
        run: |
          set -euo pipefail
          # SECURITY: This step never echoes secret values. Values are masked and only names are verified.
          # Bootstrap seeding (docs/deploy.md) guarantees the first deploy is never secret-less even before this loop.
          echo "Syncing runtime secrets from GitHub Environment 'production' to Fly..."
          echo "Values are never echoed; verification uses 'fly secrets list' (names only)."

          # Mask any values that might appear in logs (defense in depth — we still never echo them).
          for var in OPENAI_API_KEY LANGSMITH_API_KEY SUPABASE_SERVICE_KEY COACH_INTERNAL_TOKEN; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              echo "::add-mask::$val"
            fi
          done

          # Expected secrets per .env.example (server-relevant subset).
          # Adjust this list when .env.example adds required server secrets; source of truth is the production env.
          EXPECTED_NAMES=(
            OPENAI_API_KEY
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
            COACH_INTERNAL_TOKEN
            LANGSMITH_FEEDBACK_PROJECT_ID
            COACH_ALLOWED_ORIGINS
            CORS_ALLOW_ORIGINS
          )
          # Optional (set if present, but not fatal if absent — caller may use LANGSMITH_API_KEY for smoke feedback probe).
          OPTIONAL_NAMES=(
            LANGSMITH_API_KEY
            LANGSMITH_PROJECT
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
          )

          SET_ARGS=()
          MISSING_REQUIRED=()
          for name in "${EXPECTED_NAMES[@]}"; do
            val="${!name:-}"
            if [ -z "$val" ]; then
              # For Fly secrets that were bootstrapped before first deploy, an empty value here is still a hard error —
              # it means the production environment is missing the secret. Fail closed with a clear message.
              MISSING_REQUIRED+=("$name")
            else
              SET_ARGS+=("$name=$val")
            fi
          done
          for name in "${OPTIONAL_NAMES[@]}"; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              SET_ARGS+=("$name=$val")
            fi
          done

          if [ "${#MISSING_REQUIRED[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets in production environment: ${MISSING_REQUIRED[*]}"
            echo "::error::Set them on the GitHub Environment 'production' and in Fly via 'fly secrets set' (see docs/deploy.md bootstrap)."
            exit 1
          fi

          if [ "${#SET_ARGS[@]}" -eq 0 ]; then
            echo "::error::No secrets to sync — this should not happen (expected list is non-empty)"
            exit 1
          fi

          echo "Importing ${#SET_ARGS[@]} secrets into Fly in one update (values not shown)..."
          if ! printf '%s\n' "${SET_ARGS[@]}" | FLY_API_TOKEN="$FLY_API_TOKEN" flyctl secrets import -a hc-rag-server-prod --stage >/dev/null 2>&1; then
            echo "::error::Fly secrets import failed"
            exit 1
          fi
          echo "Secrets import complete."

          echo "Verifying via 'fly secrets list' (NAME-only, values never shown)..."
          SECRET_NAMES="$(FLY_API_TOKEN="$FLY_API_TOKEN" flyctl secrets list -a hc-rag-server-prod 2>&1 || true)"
          echo "$SECRET_NAMES" | head -n 50
          # Basic NAME-only assertion: each expected name must appear in the list output.
          for name in "${EXPECTED_NAMES[@]}"; do
            if ! echo "$SECRET_NAMES" | grep -q "$name"; then
              echo "::warning::Secret name '$name' not found in 'fly secrets list' output — it may still be deploying or the list format changed. Not failing, but investigate."
            fi
          done
          echo "Secrets NAME-only verification done."

      - name: Deploy to Fly (immutable digest)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          DIGEST='${{ needs.build.outputs.digest }}'
          if [ -z "$DIGEST" ]; then
            echo "::error::build digest is empty — refusing to deploy mutable tag"
            exit 1
          fi
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::digest '$DIGEST' is not a valid sha256 digest — refusing to deploy"
            exit 1
          fi
          SOURCE_IMAGE="ghcr.io/${{ github.repository }}@${DIGEST}"
          FLY_IMAGE_TAG="registry.fly.io/hc-rag-server-prod:${{ github.ref_name }}"
          echo "Config: deploy/fly.prod.toml"
          echo "App: hc-rag-server-prod"

          flyctl auth docker
          docker buildx imagetools create \
            --tag "$FLY_IMAGE_TAG" \
            "$SOURCE_IMAGE"
          FLY_DIGEST="$(docker buildx imagetools inspect "$FLY_IMAGE_TAG" --format '{{json .Manifest}}' | jq -r '.digest')"
          if ! printf '%s' "$FLY_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Fly registry digest '$FLY_DIGEST' is not a valid sha256 digest"
            exit 1
          fi
          IMAGE="registry.fly.io/hc-rag-server-prod@${FLY_DIGEST}"
          echo "Deploying immutable Fly registry image: $IMAGE"

          flyctl deploy \
            -a hc-rag-server-prod \
            --config deploy/fly.prod.toml \
            --image "$IMAGE" \
            --strategy immediate
          echo "Fly deploy command completed."

      - name: Wait for /ok (readiness-gated)
        run: |
          set -euo pipefail
          PROD_URL="https://hc-rag-server-prod.fly.dev"
          echo "Polling $PROD_URL/ok until 200 or timeout (5 minutes)..."
          for i in $(seq 1 60); do
            HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/ok" || echo 000)"
            echo "  attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "/ok returned 200 — ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::/ok never returned 200 after 5 minutes"
              exit 1
            fi
            sleep 5
          done

      - name: Set up uv (for smoke)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Run deployed smoke (production secrets, synthetic accounts, tracing off, no --allow-insecure-staging)
        id: smoke
        env:
          LANGGRAPH_DEPLOYMENT_URL: https://hc-rag-server-prod.fly.dev
          LANGGRAPH_U1_TOKEN: ${{ secrets.LANGGRAPH_U1_TOKEN }}
          LANGGRAPH_U2_TOKEN: ${{ secrets.LANGGRAPH_U2_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          COACH_INTERNAL_TOKEN: ${{ secrets.COACH_INTERNAL_TOKEN }}
          LANGSMITH_FEEDBACK_PROJECT_ID: ${{ secrets.LANGSMITH_FEEDBACK_PROJECT_ID }}
          LANGSMITH_TRACING: "false"
        run: |
          set -euo pipefail
          # Mask tokens before they can appear in logs (defense in depth; redaction script also strips them).
          for var in LANGGRAPH_U1_TOKEN LANGGRAPH_U2_TOKEN SUPABASE_SERVICE_KEY LANGSMITH_API_KEY COACH_INTERNAL_TOKEN; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              echo "::add-mask::$val"
            fi
          done
          # Confirm prod URL is HTTPS and no --allow-insecure-staging flag is required (per scripts/deployed_smoke.py:74-120).
          PROD_URL="https://hc-rag-server-prod.fly.dev"
          echo "Running: uv run python scripts/deployed_smoke.py --url $PROD_URL"
          echo "Env: LANGSMITH_TRACING=$LANGSMITH_TRACING (tracing off for prod synthetic check)"
          set +e
          uv run python scripts/deployed_smoke.py --url "$PROD_URL" --profile gate 2>&1 | tee /tmp/smoke-raw.log
          SMOKE_RC=${PIPESTATUS[0]}
          set -e
          echo "smoke_exit_code=$SMOKE_RC" >> "$GITHUB_OUTPUT"
          # Always produce an output file for the redaction step, even on failure.
          cp /tmp/smoke-raw.log /tmp/smoke-to-redact.log || true
          if [ "$SMOKE_RC" -ne 0 ]; then
            echo "::error::Deployed smoke failed with exit code $SMOKE_RC — pipeline is RED. Bad version remains live until a human rolls back (NO auto-rollback)."
            echo "::error::Rollback: gh workflow run deploy.yml -f version=<previous tag> -f reason='smoke red on ${{ github.ref_name }}' (see docs/deploy.md §6)"
          fi
          # Do not exit yet — let the redaction + artifact upload run before deciding.

      - name: Redact smoke log + upload artifact
        if: always()
        run: |
          set -euo pipefail
          RAW="/tmp/smoke-to-redact.log"
          REDACTED="/tmp/smoke-redacted.log"
          if [ ! -f "$RAW" ]; then
            echo "No smoke log found — creating empty placeholder"
            echo "no smoke log produced" > "$RAW"
          fi
          # Redaction lives in scripts/redact_smoke_log.py: the rollback job
          # redacts identically, and a heredoc in YAML cannot be tested.
          # Auth headers stripped, credential shapes masked, long lines
          # truncated to status + length.
          python3 scripts/redact_smoke_log.py --in "$RAW" --out "$REDACTED"
          # Sanity: the redacted log must not still carry a token-shaped value.
          if grep -qi "Bearer.*[A-Za-z0-9_\-]\{20\}" "$REDACTED" 2>/dev/null; then
            echo "::warning::Redacted log may still contain a Bearer token pattern — review manually"
          fi
          echo "Redacted log preview (first 80 lines):"
          head -n 80 "$REDACTED" || true
          mkdir -p /tmp/deploy-artifact
          cp "$REDACTED" /tmp/deploy-artifact/smoke-redacted.log
          echo "Artifact staged at /tmp/deploy-artifact/"

      - name: Upload redacted smoke log artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-prod-${{ needs.build.outputs.version || github.ref_name }}
          path: /tmp/deploy-artifact/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail job if smoke failed (no auto-rollback)
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        run: |
          RC='${{ steps.smoke.outputs.smoke_exit_code }}'
          if [ -z "$RC" ]; then
            echo "::error::Smoke step did not produce an exit code — failing closed"
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            echo "::error::Smoke failed (exit $RC) — pipeline is RED. Human must roll back per docs/deploy.md §6: gh workflow run deploy.yml -f version=<previous tag> -f reason='...'"
            exit 1
          fi
          echo "Smoke passed — deploy verified."

  rollback:
    # Re-deploy a previous release: its image digest AND its deploy/fly.prod.toml.
    # Deploying the old image against the current TOML is the SERVER_STORAGE trap
    # in docs/deploy.md §6.3 — checking out the target tag makes that pair
    # impossible to get wrong.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://hc-rag-server-prod.fly.dev
    concurrency:
      # Same group as deploy-prod: a rollback and a tag deploy serialise.
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          DIGEST_OVERRIDE: ${{ inputs.image_digest }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?$'; then
            echo "::error::version '$VERSION' must be a released tag matching v[0-9]+.[0-9]+.[0-9]+ (optionally -suffix)"
            exit 1
          fi
          if [ -z "${REASON// /}" ]; then
            echo "::error::reason is required — it is the record of why prod changed"
            exit 1
          fi
          if [ -n "${DIGEST_OVERRIDE:-}" ] && ! printf '%s' "$DIGEST_OVERRIDE" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::image_digest '$DIGEST_OVERRIDE' is not a sha256:<64 hex> digest"
            exit 1
          fi
          echo "Rollback target: $VERSION"
          echo "Reason: $REASON"

      - name: Check out the target release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Verify the tag is the one on origin and is reachable from main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Same ancestry rules as the forward path: a rollback must not be able
          # to deploy a tag that never came from main.
          if ! git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            echo "::error::tag refs/tags/$VERSION not found on origin"
            exit 1
          fi
          TAG_SHA="$(git rev-list -n 1 "refs/tags/$VERSION" 2>/dev/null || git rev-parse "refs/tags/$VERSION^{}" 2>/dev/null || true)"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Tag $VERSION -> $TAG_SHA"
          echo "HEAD     -> $HEAD_SHA"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::HEAD $HEAD_SHA does not match tag $VERSION ($TAG_SHA)"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_SHA" "origin/main"; then
            echo "::error::tag $VERSION points to $TAG_SHA, which is not reachable from origin/main"
            exit 1
          fi
          echo "commit_sha=$TAG_SHA" >> "$GITHUB_ENV"
          echo "Tag existence + checkout + main ancestry verification OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the release image digest
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
          DIGEST_OVERRIDE: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          # The immutable {{version}} image tag is the ledger: one git tag, one
          # build, one digest. No separate release database to drift.
          SEMVER="${VERSION#v}"
          SOURCE_REPO="ghcr.io/${{ github.repository }}"
          if [ -n "${DIGEST_OVERRIDE:-}" ]; then
            echo "Using break-glass digest override (release tag not consulted)."
            DIGEST="$DIGEST_OVERRIDE"
          else
            echo "Resolving ${SOURCE_REPO}:${SEMVER} ..."
            if ! DIGEST="$(docker buildx imagetools inspect "${SOURCE_REPO}:${SEMVER}" --format '{{json .Manifest}}' | jq -r '.digest')"; then
              echo "::error::could not resolve ${SOURCE_REPO}:${SEMVER} — was the release tag deleted from GHCR? Re-run with image_digest set."
              exit 1
            fi
          fi
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::resolved digest '$DIGEST' is not a valid sha256 digest — refusing to deploy"
            exit 1
          fi
          # Prove the digest exists before it reaches a deploy.
          docker buildx imagetools inspect "${SOURCE_REPO}@${DIGEST}" >/dev/null
          echo "source_image=${SOURCE_REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Rollback image: ${SOURCE_REPO}@${DIGEST}"

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4

      # NOTE: no secret sync here, deliberately. A rollback must be able to
      # recover from a bad secret sync; re-applying the current environment
      # during one would re-apply the fault. See the decision record.

      - name: Deploy the rollback target (immutable digest)
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SOURCE_IMAGE: ${{ steps.resolve.outputs.source_image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FLY_IMAGE_TAG="registry.fly.io/hc-rag-server-prod:${VERSION}"
          echo "Config: deploy/fly.prod.toml @ ${VERSION} (checked out above)"
          echo "App: hc-rag-server-prod"

          flyctl auth docker
          docker buildx imagetools create \
            --tag "$FLY_IMAGE_TAG" \
            "$SOURCE_IMAGE"
          FLY_DIGEST="$(docker buildx imagetools inspect "$FLY_IMAGE_TAG" --format '{{json .Manifest}}' | jq -r '.digest')"
          if ! printf '%s' "$FLY_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Fly registry digest '$FLY_DIGEST' is not a valid sha256 digest"
            exit 1
          fi
          IMAGE="registry.fly.io/hc-rag-server-prod@${FLY_DIGEST}"
          echo "fly_image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Deploying immutable Fly registry image: $IMAGE"

          flyctl deploy \
            -a hc-rag-server-prod \
            --config deploy/fly.prod.toml \
            --image "$IMAGE" \
            --strategy immediate
          echo "Fly deploy command completed."

      - name: Wait for /ok (readiness-gated)
        run: |
          set -euo pipefail
          PROD_URL="https://hc-rag-server-prod.fly.dev"
          echo "Polling $PROD_URL/ok until 200 or timeout (5 minutes)..."
          for i in $(seq 1 60); do
            HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/ok" || echo 000)"
            echo "  attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "/ok returned 200 — ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::/ok never returned 200 after 5 minutes — the rollback target did not boot. Check deploy/fly.prod.toml at this tag against the image (docs/deploy.md §6.3)."
              exit 1
            fi
            sleep 5
          done

      - name: Set up uv (for smoke)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Run deployed smoke against the rolled-back version
        id: smoke
        env:
          LANGGRAPH_DEPLOYMENT_URL: https://hc-rag-server-prod.fly.dev
          LANGGRAPH_U1_TOKEN: ${{ secrets.LANGGRAPH_U1_TOKEN }}
          LANGGRAPH_U2_TOKEN: ${{ secrets.LANGGRAPH_U2_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          COACH_INTERNAL_TOKEN: ${{ secrets.COACH_INTERNAL_TOKEN }}
          LANGSMITH_FEEDBACK_PROJECT_ID: ${{ secrets.LANGSMITH_FEEDBACK_PROJECT_ID }}
          LANGSMITH_TRACING: "false"
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for var in LANGGRAPH_U1_TOKEN LANGGRAPH_U2_TOKEN SUPABASE_SERVICE_KEY LANGSMITH_API_KEY COACH_INTERNAL_TOKEN; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              echo "::add-mask::$val"
            fi
          done
          PROD_URL="https://hc-rag-server-prod.fly.dev"
          set +e
          uv run python scripts/deployed_smoke.py --url "$PROD_URL" --profile gate 2>&1 | tee /tmp/smoke-raw.log
          SMOKE_RC=${PIPESTATUS[0]}
          set -e
          echo "smoke_exit_code=$SMOKE_RC" >> "$GITHUB_OUTPUT"
          cp /tmp/smoke-raw.log /tmp/smoke-to-redact.log || true
          if [ "$SMOKE_RC" -ne 0 ]; then
            echo "::error::Smoke failed on the ROLLED-BACK version — prod is now running ${VERSION} and it is also unhealthy. Escalate: docs/deploy.md §6."
          fi

      - name: Redact smoke log + upload artifact
        if: always()
        run: |
          set -euo pipefail
          RAW="/tmp/smoke-to-redact.log"
          REDACTED="/tmp/smoke-redacted.log"
          if [ ! -f "$RAW" ]; then
            echo "no smoke log produced" > "$RAW"
          fi
          python3 scripts/redact_smoke_log.py --in "$RAW" --out "$REDACTED"
          mkdir -p /tmp/deploy-artifact
          cp "$REDACTED" /tmp/deploy-artifact/smoke-redacted.log
          head -n 80 "$REDACTED" || true

      - name: Upload redacted smoke log artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-prod-${{ inputs.version }}
          path: /tmp/deploy-artifact/
          retention-days: 7
          if-no-files-found: warn

      - name: Record the rollback
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          SOURCE_IMAGE: ${{ steps.resolve.outputs.source_image }}
          FLY_IMAGE: ${{ steps.deploy.outputs.fly_image }}
          SMOKE_RC: ${{ steps.smoke.outputs.smoke_exit_code }}
          OPERATOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # This summary is the evidence record docs/deploy.md §6.1 asks for.
          {
            echo "## Rollback to \`${VERSION}\`"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| target release | \`${VERSION}\` |"
            echo "| commit | \`${commit_sha:-unknown}\` |"
            echo "| source image | \`${SOURCE_IMAGE:-not resolved}\` |"
            echo "| fly image | \`${FLY_IMAGE:-not deployed}\` |"
            echo "| smoke | ${SMOKE_RC:-did not run} |"
            echo "| operator | @${OPERATOR} |"
            echo "| reason | ${REASON} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if smoke failed
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        run: |
          RC='${{ steps.smoke.outputs.smoke_exit_code }}'
          if [ -z "$RC" ]; then
            echo "::error::Smoke step did not produce an exit code — failing closed"
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            echo "::error::Smoke failed (exit $RC) on the rolled-back version — escalate per docs/deploy.md §6."
            exit 1
          fi
          echo "Smoke passed — rollback verified."
