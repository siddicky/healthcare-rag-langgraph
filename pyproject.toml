[project]
name = "healthcare-rag"
version = "1.1.5"
description = "Hybrid RAG agent with answer validation over healthcare product monographs (Lipitor, Metformin)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "openai>=1.76,<2",
    # Capped below 4.16.3: from that release weaviate-client requires
    # grpcio<1.80, which is disjoint with the grpcio>=1.80 that langgraph-api
    # 0.12.6 requires — and 0.12.6 is the api_version pinned in langgraph.json
    # (the deployment image) and the version the parity oracle characterizes.
    # Both of those resolve `.` from this file rather than from uv.lock, so
    # without the cap the image build and tests/server/oracle/.venv silently
    # pick weaviate-client 4.23 + grpcio 1.78 and the server dies on import
    # ("generated code in core_api_pb2_grpc.py depends on grpcio>=1.80.0").
    # Revisit once api_version moves past 0.12.x / the Weaviate Cloud migration.
    "weaviate-client>=4.14,<4.16.3",
    # Pinecone A/B retrieval arm + the Inference reranker. Sync client only:
    # it is driven from anyio worker threads, so no aiohttp/asyncio extra is needed.
    "pinecone>=7,<10",
    "Jinja2>=3.1",
    "PyYAML>=6",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.25",      # makes fuzzywuzzy fast & silences its warning
    "langgraph>=1.2,<2",
    "langchain>=1,<2",
    "langchain-core>=1.5,<2",
    "langchain-openai>=1.1.9,<2",
    "httpx>=0.28,<1",
    "presidio-analyzer==2.2.364",
    "spacy==3.8.15",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
    "starlette>=0.40",
    "uvicorn>=0.30,<1",
    "croniter>=3,<4",
    "tzdata",
    "langgraph-sdk>=0.3,<0.4",
    "langsmith>=0.4",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
]

[tool.uv]
constraint-dependencies = ["langgraph-api>=0.13,<0.14"]

[project.optional-dependencies]
# LangSmith tracing + the evals/ harness
evals = [
    "langsmith>=0.4",
    "tiktoken>=0.9",
    # multi-turn simulator (evals/multiturn_harness.py). Pulls in langchain-openai,
    # which must resolve against openai<2 — see evals/README.md "Multi-turn evals".
    "openevals>=0.2",
]
# Only needed to re-chunk the PDFs (data/chunks_*.json are checked in)
ingest = [
    "docling>=2.30",
    "transformers>=4.51",
]
dev = [
    "httpx-sse>=0.4,<1",
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "rich>=14",
    "langgraph-cli[inmem]>=0.4.31,<0.5",
    "langgraph-sdk>=0.3,<0.4",
    "basedpyright>=1.31",
    "ruff>=0.12",
]
# SQLite checkpointer for durable per-thread history (`langgraph dev` / engine)
graph-sqlite = [
    "langgraph-checkpoint-sqlite>=3,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["healthcare_rag*", "evals*", "server*"]

[tool.setuptools.package-data]
healthcare_rag = ["prompts/*.yaml.j2"]

[tool.pytest.ini_options]
# strict, not "auto": in auto mode pytest-asyncio hooks `pytest_fixture_setup`
# for every unmarked async fixture and races the anyio plugin for ownership of
# the async-generator fixtures in tests/server (see tests/server/conftest.py).
# Strict mode makes ownership explicit -- each async test carries its own
# runner marker (`pytest.mark.asyncio` or `pytest.mark.anyio`) -- so the two
# plugins never contend and the outcome no longer depends on plugin
# registration order.
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not judge'"   # judge tests are opt-in: pytest -m judge

[tool.ruff]
exclude = [
    ".agents",
    ".claude",
    ".codex",
    ".langgraph_api",
    ".omc",
    ".omo",
    ".pageindex",
    ".playwright-mcp",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "artifacts",
    "build",
    "dist",
    "frontend/.next",
    "frontend/node_modules",
    "healthcare_rag.egg-info",
    "Nymble Health Design System",
    "tmp",
]
