[project]
name = "healthcare-rag"
version = "0.2.0"
description = "Hybrid RAG agent with answer validation over healthcare product monographs (Lipitor, Metformin)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "openai>=1.76,<2",
    # Capped below 4.16.3: from that release weaviate-client requires
    # grpcio<1.80, which is disjoint with langgraph-api>=0.9's grpcio>=1.80.
    # Since weaviate-client ships into the deployment image (dependencies: ["."]),
    # the cap is what keeps the image build resolvable on the pinned api_version.
    # Revisit during the Weaviate Cloud migration.
    "weaviate-client>=4.14,<4.16.3",
    # Pinecone A/B retrieval arm + the Inference reranker. Sync client only:
    # it is driven from anyio worker threads, so no aiohttp/asyncio extra is needed.
    "pinecone>=7,<10",
    "Jinja2>=3.1",
    "PyYAML>=6",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.25",      # makes fuzzywuzzy fast & silences its warning
    "langgraph>=1.2,<2",
    "langchain>=1,<2",
    "langchain-core>=1.5,<2",
    "langchain-openai>=1.1.9,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
# LangSmith tracing + the evals/ harness
evals = [
    "langsmith>=0.4",
    "tiktoken>=0.9",
    # multi-turn simulator (evals/multiturn_harness.py). Pulls in langchain-openai,
    # which must resolve against openai<2 — see evals/README.md "Multi-turn evals".
    "openevals>=0.2",
]
# Only needed to re-chunk the PDFs (data/chunks_*.json are checked in)
ingest = [
    "docling>=2.30",
    "transformers>=4.51",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "rich>=14",
    "langgraph-cli[inmem]>=0.4.31,<0.5",
    "langgraph-sdk>=0.3,<0.4",
    "basedpyright>=1.31",
    "ruff>=0.12",
    # The presidio/spaCy engine lives in services/privacy and is reached over
    # HTTP at runtime. Tests run that same service in-process, so the dev
    # environment installs it editable (see [tool.uv.sources]); the deployment
    # image never does.
    "healthcare-privacy-service",
]
# SQLite checkpointer for durable per-thread history (`langgraph dev` / engine)
graph-sqlite = [
    "langgraph-checkpoint-sqlite>=3,<4",
]

[tool.uv.sources]
healthcare-privacy-service = { path = "services/privacy", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["healthcare_rag*", "evals*"]

[tool.setuptools.package-data]
healthcare_rag = ["prompts/*.yaml.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not judge'"   # judge tests are opt-in: pytest -m judge

[tool.ruff]
exclude = [
    ".agents",
    ".claude",
    ".codex",
    ".langgraph_api",
    ".omc",
    ".omo",
    ".pageindex",
    ".playwright-mcp",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "artifacts",
    "build",
    "dist",
    "frontend/.next",
    "frontend/node_modules",
    "healthcare_rag.egg-info",
    "Nymble Health Design System",
    "tmp",
]
