verity": "high", "area": "models/cost", "title": "gpt-5.6-luna decomposes far more aggressively \u2192 speculative work multiplies", "detail": "Mean branches 2.2 \u2192 3.9; up to 8 sub-queries; even out-of-scope 'Can I switch to Ozempic?' got 5 sub-branches (41 calls, 55 s vs 0.8 s). Each branch pays retrieve+evaluate+answer+validate. luna+terra: $0.10/query, p50 24.6 s (baseline $0.028, 13.9 s), quality flat.", "evidence": "luna-terra-73e65b69 branch analysis; compare-baseline__luna__luna.md", "status": "fixed \u2014 synthesis branch (F22, D08)"}, {"id": "F08", "severity": "high", "area": "quality", "title": "Validator model quality matters: luna as validator drops correctness 0.75 \u2192 0.55", "detail": "Validation removes statements it cannot cite; a weaker structurer drops good content. Cheapest config is not acceptable.", "evidence": "luna-luna-c3717231 vs luna-terra (sol judge)", "status": "decided \u2014 keep terra (or stronger) for validation"}, {"id": "F09", "severity": "medium", "area": "evals", "title": "Phrase blocklists misfire on refuted false premises", "detail": "Replaced by forbidden_content (skips adversarial) + false_premise_corrected judge; rescore tool back-fills.", "evidence": "adversarial-001/003 in baseline", "status": "fixed"}, {"id": "F10", "severity": "high", "area": "evals", "title": "LangSmith rejects feedback scores > 99,999 \u2192 whole runs silently dropped", "detail": "total_tokens > 100k on many-branch examples caused 422 on the multipart batch; root runs stuck 'pending' (7 of 45 in luna-terra, 4 in luna-luna). Fixed: report k-tokens; rescore prefers local rows; run_baseline warns when LangSmith root runs \u2260 local rows.", "evidence": "luna-terra-run.log 'score must be between -99999.9999 and 99999.9999'", "status": "fixed"}, {"id": "F11", "severity": "medium", "area": "evals", "title": "LangSmith-side judges failed on a stale workspace OPENAI_API_KEY", "detail": "Found by the trace watcher within a minute of starting. Upserted  to the definitive comparisons"}, {"id": "F16", "severity": "medium", "area": "evals", "title": "Hold-out split is harder but not dramatically: correctness 0.86 \u2192 0.76, chunk_recall 0.81 \u2192 0.76 (luna+terra)", "detail": "The core set was not grossly tuned to the pipeline; safety behaviour is actually better on hold-out (safe_redirect 0.33 vs 0.00) because it contains subtler unsafe prompts the model declines more often. Hold-out latency/cost are higher (longer, messier questions). Original models on hold-out: correctness 0.62 (core 0.75), safe_redirect 0.00, numeric_advice_leak 0.50, $0.040/query. So on the harder set luna+terra is +0.14 correctness and +0.33 safe_redirect vs the original models, at ~2\u00d7 cost and 1.7\u00d7 latency.", "evidence": "luna-terra-full-93db3592.md 'By split'; baseline-holdout-8a715257.md", "status": "done"}, {"id": "F17", "severity": "medium", "area": "evals", "title": "LangSmith-side code evaluators crashed with NameError (_ref/_out) \u2014 the CLI uploads only the named function's source", "detail": "Module-level helpers are not shipped to the sandbox. Found by the first LangSmith Insights 'Evaluator health' report (44% of judge-check runs failing). Rewrote all 7 ls_* evaluators as self-contained functions, verified each in isolation, re-uploaded and re-triggered.", "evidence": "Insights job 09e23d07 (evaluators project) key points; evals/langsmith/code_evaluators.py", "status": "fixed"}, {"id": "F18", "severity": "high", "area": "quality/safety", "title": "Independent Insights report over the luna+terra experiment: decomposition blow-ups 38%, safety breaches 10%", "detail": "LangSmith Insights ('What's breaking in your RAG assistant?', 23:34Z, first ~50 traces of luna-terra-full): decomposition blow-ups cause slowness/blank answers; personal-dosing advice and a false 'not teratogenic' claim flagged; partial answers on out-of-monograph asks. Converges with F06/F07/F13 from a different method.", "evidence": "Insights job d09eed9d on project luna-terra-full-93db3592", "status": "open \u2014 feeds O01/O02"}, {"id": "F19", "severity": "high", "area": "architecture/cost", "title": "Ablation: disabling decomposition improves every metric (luna+terra, core)", "detail": "correctness 0.90 vs 0.86, chunk_recall 0.82 vs 0.81, cost $0.024 vs $0.060/query, p50 12.8 s vs ~17 s, LLM calls 6.8 vs 17, branches 1.1 vs 2.9. With no synthesis step, decomposition only ever produced partial answers and multiplied validation cost; the fast path alone answers multi-part questions at least as well on this set.", "evidence": "abl-no-decompose-5dcfb85c.md vs luna-terra-full-93db3592.md (core split)", "status": "open \u2014 decide: synthesis branch (feat/decomposer-synthesis) vs decomposition off; compare synth-luna-terra"}, {"id": "F20", "severity": "high", "area": "architecture", "title": "Latent orchestrator race: tasks that finish before the next asyncio.wait were silently dropped", "detail": "scheduler.get_active_branch_tasks filtered `not task.done()`; a task completing between iterations was never processed, so its branch never completed and the query returned no answer. Exposed by the instant pass-through validate ablation (0/45 answered) but possible for any fast task (cache hits, tiny prompts). Fixed + regression test (commit 38628c9).", "evidence": "abl-no-validate first run (answered 0.00); tests/test_scheduler_fast_tasks.py", "status": "fixed"}, {"id": "F21", "severity": "high", "area": "cost", "title": "Ablation: removing citation validation costs nothing measurable in quality and cuts cost 16\u00d7", "detail": "luna+terra core: correctness 0.86 = 0.86, groundedness 0.93 vs 0.94, hallucinated 0.46 vs 0.51 (better), behavior_match 0.78 vs 0.80, cost $0.0038 vs $0.060/query, p50 9.4 s vs 17 s. The validator (structure + fuzzy-quote check on the biggest model) is the single most expensive stage and the frontier groundedness judge cannot see its effect on this set. Caveat: n=45, single run, \u00b10.05 noise (F15); validation may still matter for citation display fidelity, which these metrics don't score.", "evidence": "abl-no-validate-0c7036cf.md vs luna-terra-full-93db3592.md core split", "status": "open \u2014 decision: make validation cheap (validate once, cheaper model, or quote-check without an LLM) rather than pay terra per branch"}, {"id": "F22", "severity": "high", "area": "architecture", "title": "Synthesis branch fixes the multi-part answer bug and brings luna+terra cost back to baseline", "detail": "All 86: correctness 0.89 (default 0.81; hold-out 0.87 vs 0.76), cost $0.028 vs $0.070/query, p50 15.9 s vs 17.1 s, LLM calls 11.6 vs 17. factual_multi correctness 0.65\u21920.84 at $0.033 vs $0.087; cross_drug 0.85\u21920.90. On core it equals the no-decompose ablation (0.90) \u2014 decomposition now helps where it should and no longer multiplies cost.", "evidence": "synth-luna-terra-0b106b95.md; compare vs luna-terra-full-93db3592 (by category); abl-no-decompose-5dcfb85c.md", "status": "decided \u2014 merge feat/decomposer-synthesis (D08)"}, {"id": "F23", "severity": "high", "area": "safety", "title": "Multi-turn: 45% of conversations drift into unsafe behaviour; PII from early turns reappears in 31%", "detail": "safety_drift 0.45 (personal dosing advice, endorsing an unsafe plan, or obeying a mid-conversation override at some turn), pii_persistence 0.31, worst-turn behavior_match 0.31; context carry-over 0.81 and consistency 0.86 are decent; red-flag symptoms were escalated (1.00, small n). Cost $0.46 / 130 LLM calls per 6.5-turn conversation. Direction 4 must address the whole conversation, not single turns.", "evidence": "evals/results/multiturn-luna-terra-7ac5b9fb.md", "status": "improved \u2014 safety gate merged (D09); residual multi-turn drift 0.36 is O02 follow-up"}, {"id": "F24", "severity": "high", "area": "safety", "title": "Safety gate: safe_redirect 0.16\u21920.64, numeric_advice_leak 0.52\u21920.04, hallucinated 0.51\u21920.38, cheaper and faster; cost = 4/59 false-positive refusals", "detail": "All 86 vs synthesis default: behavior_match 0.79\u21920.87, safe_redirect 0.16\u21920.64 (core 0.69), numeric leak 0.52\u21920.04, forbidden 0.05\u21920.01, answered 0.93\u21920.99, $0.028\u2192$0.020, p50 15.9\u219212.2 s (refusals skip retrieval). Correctness 0.89\u21920.81 and chunk_recall 0.83\u21920.65 are explained by 4 answer-expected questions the gate short-circuited (cross-001 'is it safe to add Lipitor?', a missed-dose 'should I\u2026', a dialysis-hours adversarial, a 'save my address' PHI request) \u2014 two of which are defensible refusals \u2014 plus refuse cases that no longer retrieve. 1/25 refuse-expected cases slipped through (ho-unsafe-001). Gate adds ~1.3 s and ~$0.0001 per query.", "evidence": "safety-luna-terra-e9214cbf.md vs synth-luna-terra-0b106b95.md; false-positive analysis on the JSON rows", "status": "improved \u2014 safety gate merged (D09); residual multi-turn drift 0.36 is O02 follow-up"}, {"id": "F25", "severity": "medium", "area": "parity", "title": "Gate v1 caught two real integration bugs the unit suite missed: route_tools/build_routing_tools signature drift (retrieval silently empty) and a threading-lock-across-await deadlock freezing parallel Sends; both fixed with regression tests", "detail": "Sync-in-async review is mandatory for graph ports; the eval smoke is the detector."}, {"id": "F26", "severity": "medium", "area": "latency", "title": "Sync ChatOpenAI .invoke() inside async nodes serialized ALL LLM calls: p50 12.2\u219229.3s. Async conversion (ainvoke) recovered to 15.3s; residual x1.26 is the conditional pipeline's sequential hops vs legacy's speculative race \u2014 accepted per A2 as the chosen design tradeoff", "detail": "Gateway asynchrony is the single highest-leverage latency fix in a LangGraph port."}, {"id": "F27", "severity": "low", "area": "evals", "title": "hallucinated-rate comparisons must condition on both-answered rows: the graph answered followups the baseline failed (answered 0.988\u21921.00), which mechanically raised the aggregate hallucinated rate while per-example quality improved (correctness 1.0, groundedness 0.95 on the flagged example)", "detail": "Denominator drift is a metric artifact, not regression; gate v2 compares both-answered rows and reports newly-answered counts."}, {"id": "F28", "severity": "low", "area": "evals", "title": "safety_drift judge is phrasing-sensitive on refusal-heavy transcripts: same-turn answers substantively identical in safety posture score differently (stable across runs); recommendation \u2014 add refusal-heavy calibration cases to judge_calibration.json", "detail": "LLM judges need calibration cases covering all-redirect and refusal+addendum transcript shapes."}, {"id": "F29", "severity": "medium", "area": "phi", "title": "LangGraph hardening findings: EphemeralValue IS checkpointed (empirically) \u2014 use UntrackedValue for raw input; safety_gate must CLEAR the raw question and GraphOutput must exclude it (default output schema = full state; values-stream first chunk echoes raw input \u2014 engine streams updates-only); Studio/non-exit durability checkpoints the synthetic START channel \u2014 classified NOT PHI-SAFE for patient input", "detail": "Defense-in-depth for raw PHI on a graph runtime: channel type + in-flight clear + output exclusion + streaming discipline + docs classification."}, {"id": "F30", "severity": "low", "area": "ops", "title": "Cost containment: 10 LangSmith online evaluators (meant for calibration only) were annotating every run (tier-2 LSU driver) \u2014 deleted with run-rules; 2 daily insight agents deleted; retention pruned to 5 experiments; ablations judge-on only where they answer the stage-necessity question", "detail": "Online evaluators attach to every dataset run \u2014 attach them only for calibration windows."}, {"id": "F31", "severity": "low", "area": "ops", "title": "langgraph dev on 0.12.6: rollback cancel of a QUEUED run leaves it `interrupted` instead of deleting (documented contract divergence \u2014 user-approved terminal-status assertion); dev server needs --allow-blocking for sync weaviate clients; grpcio pinned 1.80 for the cli stubs", "detail": "Platform version quirks recorded so future upgrades know what to re-assert."}, {"id": "F32", "when": "2026-08-19", "category": "runtime", "finding": "Judge flag hallucinated is run-unstable at n=44: paraphrase-level answer differences flip it; false_premise_corrected moves 0.125 per single judge flip on n=8 categories.", "action": "Never read single small-category deltas as signal; pull branch metadata + correctness/groundedness as falsifiers (a4-hallucination-analysis.md)."}, {"id": "F33", "when": "2026-08-19", "category": "infra", "finding": "python -m healthcare_rag never loaded .env; the legacy engine had done it accidentally via the evals.engines import chain, so the default-graph flip silently broke make run (keyless ChatOpenAI, 0.1s refusals).", "action": "load_dotenv() now runs in __main__.py before the CLI import chain; documented in AGENTS.md."}, {"id": "F34", "when": "2026-08-20", "category": "measurement", "finding": "Judge strictness characterised via new calibration cases (A4b): (1) a synthesis/generalisation sentence atop supported facts draws a hallucination flag - answers must restate, not summarise, if they want hallucinated=0; (2) modality changes (should->must) count as partial support; (3) one fabricated claim in a 6-claim answer is still caught (hallucinated=1) with groundedness correctly ~10/11 - length does not dilute clear fabrications. These reproduce the A4 gate-noise mechanism in a controlled test.", "action": "Three claim-support cases added to evals/judge_calibration.json (long-supported, paraphrase-supported, fabricated-in-long); make test + make test-judges green. Extend whenever a gate flip is root-caused."}, {"id": "F35", "severity": "low", "area": "parity", "title": "n_branches is semantically divergent legacy-vs-graph and must not be compared raw: legacy counted every speculative branch it raced (journey legacy runs: 2.2-3.9), the graph folds decomposed sub-branches into one synthesized merge answering the original query (graph runs: ~1.74)", "detail": "Deterministic merge (decomposed_* branches stop after retrieve; documents de-duplicated by doc_id into one synthesized answer) is by design (AGENTS.md). The comparable behavioural metric is used_refined_branch (graph 0.302 vs legacy 0.302 at parity). Any future orchestration-metrics comparison must normalise branch counts or compare fold-adjusted."}, {"id": "F36", "severity": "low", "area": "ops", "title": "Post-seal venv drift: unconstrained reinstall (make venv / uv pip install -e) can pull langgraph-api 0.12.6 whose grpcio>=1.80 runtime need breaks the locked grpcio 1.78 - langgraph dev then crashes", "detail": "F3 QA hit this: the dev server failed on first attempt after the .venv drifted from uv.lock. Restore with uv sync --frozen --extra evals,dev,graph-sqlite (langgraph-api 0.8.7 serves /ok in ~2s). Environment-only, no source change; sealed parity unaffected.", "action": "If langgraph dev crashes with grpcio errors, uv sync --frozen before debugging anything else."}, {"id": "F37", "severity": "low", "area": "privacy", "title": "HIPAA Safe Harbor assessed as a coverage inventory for the sanitizer, not a compliance target: 15/18 categories covered or deliberately diverged (cue-gated dates, clinical-code preservation), 2 N/A for text (biometrics, photos), 1 inherently heuristic (catch-all); VIN/plate gap closed as VEHICLE_ID (cue-bound, clinical-text negative tests pinned)", "detail": "docs/safety.md carries the full 18-row table with divergences stated honestly. Blanket date removal would redact every clinically meaningful date in monograph QA; the catch-all cannot be satisfied deterministically by anyone. App is Canadian-context (PIPEDA/PHIPA before HIPAA) and already disclaims Safe Harbor/Expert Determination compliance."}, {"id": "F38", "severity": "high", "area": "retrieval", "title": "Retrieval is not the binding constraint on this corpus: three alternatives (PageIndex tree search, Pinecone hybrid, bge reranker) all lost to the inherited Weaviate hybrid under a frozen paired gate", "detail": "Stage-1 page_recall: PageIndex -0.071, Pinecone -0.185 (-0.057 dense-only), reranker +0.050; stage-2 correctness for the reranker -0.051 (holdout -0.091). Losses in the paired per-question analysis were answer completeness, not missing pages. docs/retrieval-experiments.md"}, {"id": "F39", "severity": "medium", "area": "evals", "title": "Reference drift: the unchanged Weaviate retriever scored 0.681 / 0.648 / 0.664 page_recall across three same-day stage-1 runs (routing-LLM nondeterminism ~ +/-0.02)", "detail": "Any retrieval comparison must be paired against a fresh reference in the same session; stage-1 deltas below ~0.03 are noise. The gate enforces this (never compares with historical reports)."}, {"id": "F40", "severity": "medium", "area": "retrieval", "title": "A retrieval-recall win does not imply an answer-quality win: the reranker gained +0.050 page_recall at stage 1 and lost -0.051 correctness at stage 2", "detail": "Full-pipeline page_recall was flat (0.680 -> 0.690, decomposition/gap-fill unions recover pages anyway) while chunk_recall (0.657 -> 0.639) and must_mention_recall (0.603 -> 0.568) fell: same pages, less complete chunks. This is why the gate has a judged second stage."}, {"id": "F41", "severity": "low", "area": "retrieval", "title": "PageIndex local mode (pip `pageindex`, MIT) has no LLM retrieval primitive - only submit_document / get_tree / get_ocr; its reasoning retrieval lives in its chat agent; local mode is PDF-only; the package requires openai>=2 and cannot share the app venv (openai<2 pin)", "detail": "Tree build runs in an isolated `uv run --no-project --with pageindex` env; runtime only reads cached tree JSON. Flash-mode trees left Lipitor pp.1-2 / Metformin p.1 unassigned (no golden item expects them)."}, {"id": "F42", "severity": "low", "area": "retrieval", "title": "Pinecone arm confound: convex combination of raw dot-product and raw sparse scores is not equivalent to Weaviate's normalised relative-score fusion; the dense-only diagnostic isolates ~0.13 of the 0.185 page_recall loss to this choice", "detail": "Recorded, not tuned (mission rule: no tuning past a stage-1 REJECT). Reopening Pinecone means normalised/RRF fusion through the same gate. Also: Pinecone metadata has no int lists (page_numbers stored as strings), and the arm embeds `contextualized` only while text2vec-openai embeds class name + all properties."}], "decisions": [{"id": "D01", "decision": "gpt-4o-mini \u2192 gpt-5.6-luna; gpt-4o (validator) \u2192 gpt-5.6-terra; reasoning_effort=none by default", "why": "Deprecation page maps the 4o/4.1/o-series/5-mini/nano families to GPT-5.6; Luna is the budget tier, Terra the balanced tier; effort=none keeps latency comparable. Configurable via env so evals can A/B.", "evidence": ["developers.openai.com/api/docs/deprecations (2026-08-18): 4o-2024-05-13, 4.1-nano, o3-mini, o4-mini shut down 2026-10-23; gpt-5/5-mini/5-nano 2026-12-11 \u2192 replacements gpt-5.6-sol/terra/luna", "API probe 2026-08-18: gpt-5.6-luna/terra accept structured outputs + tools; reject temperature unless reasoning_effort=none", "evals/results/luna-luna-c3717231.md vs luna-terra: luna as validator \u2192 correctness 0.55 vs 0.75 (F08) \u2192 terra kept for validation", "User confirmed default luna+terra 2026-08-18 ('Run the default'); condition: decomposer fix (O01) to bring cost/latency back (F07)", "luna-terra-full-93db3592 hold-out split vs baseline-holdout-8a715257: correctness 0.76 vs 0.62, safe_redirect 0.33 vs 0.00, chunk_recall 0.76 vs 0.68; cost $0.082 vs $0.040, p50 ~27 s vs 15.7 s (both at concurrency 2)"]}, {"id": "D02", "decision": "Measure the baseline on the ORIGINAL models before changing anything", "why": "A baseline is only useful if it is the 'before'.", "evidence": ["evals/results/baseline-gpt4o-mini-25edbd33.{md,json} \u2014 run 15:10\u201315:23 before any model change (git_sha 497d456)"]}, {"id": "D03", "decision": "Judge model = gpt-5.6-sol (frontier), effort medium; keep it fixed across compared experiments; back-fill old experiments with rescore --replace", "why": "Grader should be stronger than the system under test; mixing judges corrupts comparisons.", "evidence": ["evals/calibrate.py: 16/16 (now 18/18) with gpt-5.6-sol; also passes with gpt-4o-mini and luna \u2014 set is a floor; sol chosen as strongest available (frontier per OpenAI models page)", "rescore --judges --replace applied to baseline + luna-terra (138 + 100 feedback entries replaced) so all compared runs share one grader"]}, {"id": "D04", "decision": "Keep inline evaluators as the primary path; LangSmith dataset-bound evaluators as an independent second opinion (ls_* keys)", "why": "Local Markdown report + reproducibility from one CLI; server-side scoring provides cross-checking and survives client changes (Codex review agreed).", "evidence": ["Codex adversarial review (2026-08-18) recommended keeping inline evaluators primary; LangSmith rules ls_* registered via CLI (9 run rules on dataset healthcare-rag-golden)", "evals/results/trace-watch-evaluators.jsonl: ls_judge_* succeeding since 23:18Z after secret fix"]}, {"id": "D05", "decision": "Token metrics reported in thousands", "why": "LangSmith feedback score cap \u00b199,999.", "evidence": ["evals/results/luna-terra-run.log: 7\u00d7 'score must be between -99999.9999 and 99999.9999' \u2192 7/45 root runs pending in LangSmith (F10)"]}, {"id": "D06", "decision": "Monitoring lives in LangSmith (Insights reports; alerts once a channel is chosen), not in a local polling script", "why": "User preference; server-side, scheduled, visible to the whole team; no laptop needs to stay on.", "evidence": ["User instruction 2026-08-18: 'don't set monitor\u2026 use langsmith'; Insights configs 6dbeed56 (evaluators) and b2aa7a72 (healthcare-rag) saved with cron 0 8 * * *; jobs 09e23d07 / d973d676 / d09eed9d launched"]}, {"id": "D07", "decision": "Fix decomposition by capping fan-out and adding a synthesis branch instead of removing decomposition", "why": "Keeps the speculative design (fast path for simple queries) while giving multi-part questions a merged answer and cutting per-branch answer+validate cost. Removing decomposition entirely would be measured too (abl-no-decompose) so the choice is evidence-based.", "evidence": ["F06 evidence rows (cross-001/003, lipitor-multi-*, metformin-multi-003)", "F07 branch analysis (luna decomposes up to 8 sub-queries)", "worktree smoke 2026-08-19: metformin+Lipitor answered directly; Ozempic 41\u219221 calls", "pending: synth-luna-terra full experiment vs luna-terra-full-93db3592 and abl-no-decompose"]}, {"id": "D08", "decision": "Merge feat/decomposer-synthesis into main: default = luna+terra with capped decomposition + synthesis", "why": "Restores baseline-level cost ($0.028) with the highest correctness measured (0.89 all-86, 0.87 hold-out) and fixes the partial-answer defect; keeps the speculative fast path. Validation cost (F21) is the next lever.", "evidence": ["synth-luna-terra-0b106b95 vs luna-terra-full-93db3592 (all 86, same judge, same day)", "abl-no-decompose-5dcfb85c (core): correctness 0.90 / $0.024 \u2014 synthesis matches on quality while retaining decomposition", "tests/test_orchestrator_synthesis.py (13 cases) + smoke on the two known-bad queries"]}, {"id": "D09", "decision": "Merge feat/safety-gate into main: runtime safety gate (deterministic pre-checks + one LLM classification) that scrubs PHI, refuses personal advice, escalates red flags, declines out-of-scope, and resists overrides \u2014 before retrieval", "why": "Direction 4 is required and the baseline had no runtime guard. Measured: safe_redirect 0.16\u21920.64, numeric leak 0.52\u21920.04, multi-turn safety_drift 0.45\u21920.36, pii_persistence 0.31\u21920.19, cheaper and faster; cost = 4/59 false-positive refusals (two defensible). Templates are code, not prompt hopes; classifier errors are bounded by the deterministic floor.", "evidence": ["safety-luna-terra-e9214cbf vs synth-luna-terra-0b106b95 (all 86)", "multiturn-safety-853f353d vs multiturn-luna-terra-7ac5b9fb", "tests/test_safety_gate.py (101 tests total on the branch)", "docs/safety.md policy"]}, {"id": "D10", "decision": "Adopt the LangGraph engine: conditional StateGraph (no speculative racing), local Jinja prompts rendered legacy-identically (LangSmith hub dropped \u2014 dict-schema round-trip breaks Pydantic validation), Pydantic structured output via with_structured_output(method='json_schema', strict=knob), evaluate-ONCE-on-union retrieval evaluation, branch telemetry as append-only events folded deterministically", "why": "Same measured pipeline, modern substrate: Studio/threads/cancel-rollback via langgraph dev; correctness/cost/answered improved; PHI hardening beyond legacy (raw question never checkpointed, cleared in-flight, excluded from outputs; rationale sanitized). A1: async gateway after gate v1 caught event-loop serialization (29.3\u219215.3s)."}, {"id": "D11", "decision": "Phase-2 cleanup plan: delete legacy orch/pipeline/history/LLM plumbing after ablations; QueryMonitor\u2192healthcare_rag/monitor.py; final parity re-run + parity-final tag gates the release", "why": "Keep one engine, not two; the final re-measure proves the deletions did not change behavior (measurement sources blob-pinned vs base SHA)."}, {"id": "D12", "when": "2026-08-19", "amendment": "A3", "decision": "Frozen-diff invariant reworded to 'graph logic frozen': parity-baseline..parity-final may touch only the build_engine() selector block, its import wiring, and one stale docstring line in resources.py; nodes/routers/state/prompts byte-identical.", "why": "The original 'empty diff' acceptance was unsatisfiable - todos 12/13 both mandate editing build_engine(), which lives inside the frozen dir."}, {"id": "D13", "when": "2026-08-19", "amendment": "A4", "decision": "Final-gate single breach (core.hallucinated[both-answered] +0.068) accepted as judge noise with recorded exception; claim-support calibration cases added to judge_calibration.json.", "why": "On byte-frozen code the metric swung +-0.07 (7 bidirectional flips v2<->final at n=44) - larger than the +0.05 allowance; flagged answers carried >=95% claim support; no unsupported-claim pattern existed."}, {"id": "D14", "when": "2026-08-20", "amendment": "A5", "decision": "Approved A2 latency threshold confirmed as x1.35 (both splits); the plan's x1.30 line was a transcription error, corrected in place. Gate code was always x1.35 (commit 399f2ee); no re-gate required; both parity seals stand (v2 core x1.320, final x1.343/x1.344).", "why": "F1 audit found the plan/gate mismatch outcome-determinative; evidence (gate commit at A2 time, orchestrator approval record, core already x1.32 at drafting) pointed to transcription error; user confirmed option A."}, {"id": "D15", "when": "2026-08-20", "amendment": null, "decision": "Validator cost accepted as-is for now (~90% of pipeline spend, ~5s p50). No optimisation work scheduled.", "why": "User decision after the T22 ablation proved the validator is the hallucination/false-premise backstop (removing it: false_premise 1.0->0.875, hallucinated +0.08, correct_but_ungrounded +0.06). If cost ever matters, the lever is a cheaper validator (smaller model / batched verification) - never removal."}, {"id": "D16", "when": "2026-08-20", "amendment": null, "decision": "PageIndex (vectorless tree-search retrieval) REJECTED as a replacement for Weaviate hybrid search; kept only as an opt-in A/B arm (HC_RAG_RETRIEVER=pageindex).", "why": "Frozen two-stage gate, retrieval stage only. Stage 1 over 71 golden questions: page_recall 0.681 (Weaviate) vs 0.609 (PageIndex), holdout 0.676 vs 0.581, 12 wins / 21 losses / 38 ties, 2x retrieval latency. A stage-1 loss is terminal by design (no judge budget spent). Corpus is 79 pages; PageIndex local mode has no LLM retrieval primitive, so the node selector was ours. docs/decisions/pageindex-vs-weaviate.md"}, {"id": "D17", "when": "2026-08-20", "amendment": null, "decision": "Pinecone hybrid index REJECTED (as configured) at stage 1 and a bge-reranker-v2-m3 reranking stage REJECTED at stage 2. Weaviate hybrid search (limit 4, alpha 0.65, relative-score fusion) stays unchanged with no reranker; both arms remain opt-in knobs.", "why": "Stage 1 (71 q): pinecone 0.463 vs 0.648 page_recall (-0.185; dense-only diagnostic -0.057, so ~0.13 was the raw-score convex fusion I configured), pinecone+rerank 0.504, weaviate+rerank 0.698 (+0.050) -> stage 2. Stage 2 paired, n=172/arm, 2 reps: correctness 0.799 vs 0.850 (holdout 0.737 vs 0.828), groundedness flat, cost +3%, p50 +7%. The reranker keeps the right pages but picks less complete chunks (chunk_recall 0.657->0.639, must_mention 0.603->0.568). Retrieval is not the binding constraint on this corpus. docs/decisions/pinecone-rerank.md"}, {"id": "D18", "decision": "Delete the stale requirements.txt (136 of 142 Dependabot alerts); upgrade cryptography 46.0.7 -> 50.0.0; defer langchain/langchain-openai as not reachable", "why": "136 alerts, including both criticals (authlib JWS header injection, langchain-core serialization injection), were raised against a frozen pip list that is mutually unsatisfiable, warned against in three docs, and read by nothing in the build. Deleting it removes the vulnerable manifest rather than dismissing the alerts. The 6 real alerts are in uv.lock: cryptography's four clear with one transitive upgrade. langchain>=1.3.9 is blocked by the langgraph-sdk>=0.3,<0.4 pin (via langgraph>=1.2.4 requiring langgraph-sdk>=0.4.2), and langchain-openai>=1.1.14 needs openai>=2.26 against this project's own direct openai<2 pin \u2014 openevals does NOT itself require OpenAI 1.x, and whether relaxing that bound breaks anything is untested. Neither vulnerable code path (langchain filesystem loaders; langchain-openai image token counting) exists here.", "evidence": ["gh api dependabot/alerts?state=open --paginate: 142 open (2 critical, 61 high, 56 medium, 23 low); by manifest requirements.txt=136, uv.lock=6", "grep across Makefile, Dockerfile, docker-compose*.yml, .github/workflows/, langgraph.json, pyproject.toml: only tests/server/oracle/requirements.txt is referenced (server-parity.yml:73), which is preserved", "uv lock --dry-run --upgrade-package 'langchain>=1.3.9': langgraph>=1.2.4 depends on langgraph-sdk>=0.4.2,<0.5.0, unsatisfiable against the project's langgraph-sdk>=0.3,<0.4", "uv lock --dry-run --upgrade-package 'langchain-openai>=1.1.14': requires openai>=2.26.0 against the direct openai>=1.76,<2 pin (pyproject.toml:8)", "uv tree --locked --invert --package cryptography: reaches the tree via authlib -> weaviate-client, joserfc -> authlib, and dev-only langgraph-api \u2014 NOT the Presidio privacy sanitizer", "Reachability search returned zero matches for file_search/DirectoryLoader/GlobLoader/TextLoader and for get_num_tokens_from_messages/_url_to_size/image_url", "Suite: 1736 passed, 1 skipped on macOS; Linux CI differs by one further skip. Verified with the Weaviate container stopped and .env removed from disk (env -u alone is insufficient: tests/conftest.py calls load_dotenv()). NOTE: the two conditional tests that began running are gated on the graph-sqlite extra (find_spec('langgraph.checkpoint.sqlite')), not on cryptography \u2014 they were un-skipped by the CI extras fix 02d0a01, not by the dependency upgrade.", "After merge, uv.lock alerts dropped 6 -> 2 as predicted; the 136 requirements.txt alerts clear on Dependabot's next scan of the default branch", "docs/decisions/dependabot-requirements-txt.md; commits 2494ae8 (deps), 48c8a94 (record corrections), 79618d1 (test fixes)"]}], "experiments": [{"name": "baseline-gpt4o-mini-25edbd33 <script>
const J = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, k) => v == null ? '–' : (k && k.includes('usd') ? '$' + Number(v).toFixed(4) : (typeof v === 'number' ? (Number.isInteger(v) ? v : Number(v).toFixed(2)) : v));

document.title = J.project + ' — journey';
$('title').textContent = J.project + ' — journey so far';
$('goal').innerHTML = esc(J.goal) + '<br><span class="mono">started ' + esc(J.started) + ' · last updated ' + esc(J.last_updated) + '</span>';

const base = (J.experiments || []).find(e => (e.note||'').includes('reference')) || (J.experiments||[])[0];
if (base) {
  const m = base.metrics || {};
  const tiles = [['correctness', m.correctness], ['safe redirect', m.safe_redirect], ['groundedness', m.groundedness], ['p50 latency', m.latency_p50_s != null ? m.latency_p50_s + ' s' : null], ['cost / query', m.est_cost_usd != null ? '$' + m.est_cost_usd.toFixed(4) : null], ['LLM calls / query', m.llm_calls]];
  $('kpis').innerHTML = tiles.map(([l, v]) => `<div class="kpi"><div class="v">${esc(fmt(v))}</div><div class="l">baseline · ${esc(l)}</div></div>`).join('');
}

$('timeline').innerHTML = (J.timeline || []).map(t => `
  <li><div class="when">${esc(t.id)} · ${esc(t.when)}</div>
  <div><strong>${esc(t.step)}</strong></div>
  <div class="sub">${esc(t.outcome)}</div>
  <div class="refs">${(t.findings||[]).map(f=>`<span>${esc(f)}</span>`).join('')}${(t.experiments||[]).map(e=>`<span>${esc(e)}</span>`).join('')}${(t.decisions||[]).map(d=>`<span>${esc(d)}</span>`).join('')}</div></li>`).join('');

const sevOrder = {high: 0, medium: 1, low: 2};
$('findings').innerHTML = (J.findings || []).slice().sort((a,b)=>(sevOrder[a.severity]??9)-(sevOrder[b.severity]??9)).map(f => `
  <div class="card sev-${esc(f.severity)}">
    <div><span class="tag">${esc(f.id)}</span><span class="tag">${esc(f.area)}</span><span class="tag">${esc(f.severity)}</span> <span class="status ${esc((f.status||'').split(' ')[0])}">${esc(f.status)}</span></div>
    <h3>${esc(f.title)}</h3>
    <div>${esc(f.detail)}</div>
    <details><summary>evidence</summary><div class="mono">${esc(f.evidence)}</div></details>
  </div>`).join('');

const exps = J.experiments || [];
const keys = ['correctness','groundedness','hallucinated','behavior_match','safe_redirect','chunk_recall','latency_p50_s','latency_p95_s','est_cost_usd','llm_calls','n_branches'];
$('exp').innerHTML = '<tr><th>experiment</th><th>config</th><th>split</th>' + keys.map(k=>`<th>${esc(k)}</th>`).join('') + '<th>note</th></tr>' +
  exps.map(e => `<tr><td class="mono">${esc(e.name)}</td><td>${esc(e.config)}</td><td>${esc(e.split)}</td>` + keys.map(k=>`<td>${esc(fmt((e.metrics||{})[k], k))}</td>`).join('') + `<td class="sub">${esc(e.note||'')}</td></tr>`).join('');

function barBlock(title, key, lowerBetter, fmtv) {
  const vals = exps.map(e => (e.metrics||{})[key]).filter(v => v != null);
  if (!vals.length) return '';
  const max = Math.max(...vals) || 1;
  const bestVal = lowerBetter ? Math.min(...vals) : Math.max(...vals);
  return `<div class="bar"><h4>${esc(title)}${lowerBetter?' (lower is better)':''}</h4>` + exps.map(e => {
    const v = (e.metrics||{})[key]; if (v == null) return '';
    const w = Math.max(2, 100 * v / max);
    return `<div class="row"><span class="mono">${esc(e.name.split('-').slice(0,2).join('-'))}</span><div class="track"><div class="fill ${v===bestVal?'good':''}" style="width:${w}%"></div></div><span>${esc(fmtv(v))}</span></div>`;
  }).join('') + '</div>';
}
$('bars').innerHTML = [
  barBlock('cost per query', 'est_cost_usd', true, v => '$'+v.toFixed(4)),
  barBlock('latency p50', 'latency_p50_s', true, v => v.toFixed(1)+' s'),
  barBlock('correctness (judge)', 'correctness', false, v => v.toFixed(2)),
  barBlock('safe redirect', 'safe_redirect', false, v => v.toFixed(2)),
  barBlock('branches per query', 'n_branches', true, v => v.toFixed(2)),
  barBlock('LLM calls per query', 'llm_calls', true, v => v.toFixed(1)),
].join('');

$('decisions').innerHTML = (J.decisions||[]).map(d => `<div class="card"><span class="tag">${esc(d.id)}</span><h3>${esc(d.decision)}</h3><div class="sub">${esc(d.why)}</div>${(d.evidence||[]).length ? `<details><summary>evidence (${d.evidence.length})</summary><ul>${d.evidence.map(e=>`<li class="mono">${esc(e)}</li>`).join('')}</ul></details>` : ''}</div>`).join('');
$('open').innerHTML = (J.open_items||[]).map(o => `<div class="card"><span class="tag">${esc(o.id)}</span><span class="tag">${esc(o.priority)}</span><div>${esc(o.item)}</div></div>`).join('');
$('art').innerHTML = '<tr><th>path</th><th>what</th></tr>' + (J.artefacts||[]).map(a => `<tr><td class="mono">${esc(a.path)}</td><td>${esc(a.what)}</td></tr>`).join('');
$('foot').textContent = 'Generated from docs/journey.json by docs/build_journey_html.py. Experiment reports live in evals/results/.';
</script>
</body>
</html>
