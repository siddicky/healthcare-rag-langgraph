# Fly.io production config for hc-rag-server-prod
# Deploys are image-only: CI supplies --image ghcr.io/<repo>@sha256:<digest>
# No [build] section — image is built and pushed by the release workflow.

app = "hc-rag-server-prod"
primary_region = "iad"

[env]
WEAVIATE_HOST = "hc-rag-weaviate-prod.internal"
WEAVIATE_PORT = "8080"
# WEAVIATE_GRPC_PORT is not required for the HTTP-only server path;
# add "50051" here only if a future server build needs gRPC.
# Durable storage (v1.0.7): AsyncPostgresSaver/AsyncPostgresStore + hc_* tables.
# Connection comes from DATABASE_URL, set by `fly postgres attach`
# (hc-rag-server-prod-db, dedicated user/db hc_rag_server_prod). Rollback:
# revert this value to "memory" and redeploy the previous image digest —
# see docs/deploy.md §0b and .omo/evidence/postgres-flip-signoff.md.
SERVER_STORAGE = "postgres"  # STAGED ROLLOUT — do NOT flip to "postgres" in this PR. Flip is release N+1, gated on Fly Postgres provisioning (todo 18: fly postgres create + fly postgres attach) + recorded compliance sign-off per docs/deploy.md §0b. See docs/deploy.md §6 for the rollback trap.
# Member stream perimeter: v2 (FLIPPED 2026-08-25 by owner directive — see
# docs/deploy.md §0c for the recorded authorization). v2 widens the member
# surface to history/join/join-stream/cancel + messages stream mode + resumable
# + enqueue. The frontend var NEXT_PUBLIC_HC_RAG_MEMBER_STREAM_PERIMETER is
# baked wherever the member frontend is built — flip BOTH together.
HC_RAG_MEMBER_STREAM_PERIMETER = "v2"
SERVER_PORT = "8000"
# The coach reminder tools call the Agent Server cron API from inside the
# graph run (reminders.py:531 defaults to localhost:2024 — the langgraph dev
# port). In production the server must loop back to ITSELF:
LANGGRAPH_API_URL = "http://127.0.0.1:8000"
# SERVER_LOCAL_DEV must remain unset/0 in production. The Dockerfile
# already sets ENV SERVER_LOCAL_DEV=0; do not override it here.
# CORS / allowed-origins and all secrets are injected via `fly secrets set`
# from the GitHub Environment `production` (see docs/deploy.md).

[http_service]
internal_port = 8000
force_https = true
auto_start_machines = true
auto_stop_machines = false
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
path = "/ok"
timeout = "5s"
type = "http"

# No [build] section — image-only deploys.
# Health: Fly hits http://<machine>:8000/ok via the check above.
# /ok is readiness-gated (200 only after lifespan completes) and is
# public (no auth). /info is the other public endpoint.
