[project]
name = "healthcare-privacy-service"
version = "0.1.0"
description = "Presidio/spaCy identifier analyzer for healthcare-rag, served over HTTP"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi[standard]>=0.116",
    "pydantic>=2.11,<3",
    # The three pins below are the privacy engine's contract. The graph-side
    # client (healthcare_rag/processors/privacy.py) refuses to use a service that
    # reports any other versions, so move them together with the constants there.
    "presidio-analyzer==2.2.364",
    "spacy==3.8.15",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.28,<1",
]

[tool.fastapi]
entrypoint = "privacy_service.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["privacy_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
